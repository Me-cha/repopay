services:
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_USER: repopay
      POSTGRES_PASSWORD: repopay
      POSTGRES_DB: repopay
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U repopay -d repopay']
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
