name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_USER: repopay
          POSTGRES_PASSWORD: repopay
          POSTGRES_DB: repopay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U repopay -d repopay_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://repopay:repopay@127.0.0.1:5432/repopay_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
